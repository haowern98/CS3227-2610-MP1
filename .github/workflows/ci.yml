name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Build and test
        if: runner.os != 'Windows'
        run: ./gradlew clean check javadoc assemble

      - name: Build and test on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat clean check javadoc assemble

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ matrix.os }}
          path: build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

  documentation:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check required documentation
        run: |
          test -f docs/UserGuide.md
          test -f docs/DeveloperGuide.md
          test -f docs/Reflections.md

      - name: Check Markdown formatting
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          config: .markdownlint-cli2.jsonc
          globs: |
            README.md
            docs/**/*.md
            logs/**/*.md
            test/**/*.md

      - name: Check for unresolved merge markers
        shell: bash
        run: |
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- '*.md'; then
            echo 'Unresolved merge marker found.'
            exit 1
          fi
