plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.possessionmanager'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

javafx {
    version = '25.0.4'
    modules = ['javafx.controls']
}

application {
    mainClass = 'com.possessionmanager.App'
    applicationDefaultJvmArgs = ['--enable-native-access=javafx.graphics']
}

dependencies {
    implementation('com.google.code.gson:gson:2.13.2')

    testImplementation(platform('org.junit:junit-bom:5.14.2'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('releaseJar', Jar) {
    archiveFileName = 'PossessionManager.jar'
    destinationDirectory = layout.projectDirectory.dir('release')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
                'Main-Class': 'com.possessionmanager.Launcher',
                'Enable-Native-Access': 'ALL-UNNAMED'
        )
    }

    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.collect { dependency ->
            dependency.isDirectory() ? dependency : zipTree(dependency)
        }
    }
}
